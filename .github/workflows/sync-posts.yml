name: Sync posts from Medium RSS

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test scripts/sync-rss.test.mjs
      - run: npm run sync
      - name: Index new posts (only new ones get embedded; the rest reuse their vectors)
        run: git diff --quiet posts.json || npm run build
      - name: Commit if anything changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Add new posts from Medium RSS"
          git push
